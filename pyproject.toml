[project]
name = "the-watcher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sankalp6115", email = "sankalpomar6115@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.6",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "regex>=2026.11.9",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
    "spacy>=3.8.18",
    "symspellpy>=6.10.2",
    "torch>=2.15.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
the-watcher = "the_watcher:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
